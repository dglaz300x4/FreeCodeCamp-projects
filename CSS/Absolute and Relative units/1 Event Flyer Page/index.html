<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build an Event Flyer Page</title>
    <link type="stylesheet" href="styles.css">
  </head>

  <body>
    <header>
      <img class="event-image" src="https://images.squarespace-cdn.com/content/v1/54d696e5e4b05ca7b54cff5c/68333a4a-e433-4afd-98d1-eea6a9af4b68/5+Fresh+Techniques+Music+Production+Tricks+You+Should+Try.jpg?format=2500w">
      <h1>Music Creation Workshop</h1>
      <p>Come join us to create your own music</p>
      <p><b>When:</b> Sept. 5 <b>Where:</b> NIU Convocation Center </p>
      <hr>
    </header>
    <main>
      <section class="event-detail-section">
        <h2 class="event-detail-title">
          Music Genres
        </h2>
        <ul>
          <li class="event-detail">Metal</li>
          <li class="event-detail">EDM</li>
          <li class="event-detail">R&amp;B</li>
        </ul>
      </section>

      <section class="event-detail-section">
        <h2 class="event-detail-title">
          Special Guests
        </h2>
        <ul>
          <li class="event-detail">Sleep Token</li>
          <li class="event-detail">MarshMello</li>
          <li class="event-detail">Bruno Mars</li>
        </ul>
      </section>

      <section class="event-detail-section">
        <h2 class="event-detail-title">
          Free Food
        </h2>
        <ul>
          <li class="event-detail">Taco Alley</li>
          <li class="event-detail">Vinny's Pizza</li>
          <li class="event-detail">Devil Dogs</li>
        </ul>
      </section>
    </main>
    <footer>
      <hr>
      <p>&#169; Music Media Group</p>
    </footer>
  </body>

</html>
