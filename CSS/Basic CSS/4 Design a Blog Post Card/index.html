<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link type="stylesheet" href="styles.css">
</head>
    <body>
        <main>
            <div class="blog-post-card">
                <img class="post-img" alt="A macbook laptop with hands on the keyboard typing" src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg">
                <div class="post-content">
                    <h2 class="post-title">Creating your own Web-App</h2>
                    <p class="post-excerpt">Learn to create your own web app with this quick course! We'll cover different types of apps, and get you started on your own!</p>
                    <a class="read-more" href="#">Read More</a>
                </div>
            </div>
        </main>
    </body>
</html>
