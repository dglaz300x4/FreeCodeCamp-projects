<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link type="stylesheet" href="styles.css">
</head>

<body>
    <h1>To-Do Projects</h1>
    <ul class="todo-list">
        <li>
            <input type="checkbox" id="first-check">
            <label for="first-check">Obtain my Responsive Web Design Certification from freeCodeCamp.org</label>
            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" target="_blank" href="https://www.freecodecamp.org/learn/responsive-web-design-v9/">Responsive Web Design Certification courses</a>
                </li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="first-check">
            <label for="first-check">Build a portfolio website</label>
            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" target="_blank" href="#">link here</a>
                </li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="first-check">
            <label for="first-check">Set up the computer I was given as a server</label>
            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" target="_blank" href="/">web-hosting links here</a>
                </li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="first-check">
            <label for="first-check">Finally get a software engineer job!</label>
            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" target="_blank" href="https://www.indeed.com/">indeed</a>
                </li>
            </ul>
        </li>
    </ul>
</body>

</html>
