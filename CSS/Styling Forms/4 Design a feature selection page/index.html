<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <title>Selection Feature Page</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <h1>Feature Selection</h1>
        <div class="feature-card-container">
            <div class="feature-card-box">
                <label class="feature-card" for="interior">
                    <input type="checkbox" name="interior" id="interior" value="premium-interior">
                    Premium Leather Interior
                    <p>Premium leather interior and seats</p>
                </label>
            </div>
            <div class="feature-card-box">
                <label class="feature-card" for="windows">
                    <input type="checkbox" name="windows" id="windows" value="tinted-windows">
                    Tinted Windows
                    <p>Tinted windows</p>
                </label>
            </div>
            <div class="feature-card-box">
                <label class="feature-card" for="all-wheel-drive">
                    <input type="checkbox" name="all-wheel-drive" id="all-wheel-drive" value="all-wheel-drive">
                    All Wheel Drive
                    <p>Add all wheel drive to your vehicle model</p>
                </label>
            </div>
            <div class="feature-card-box">
                <label class="feature-card" for="sport">
                    <input type="checkbox" name="sport" id="sport" value="sport-transmission">
                    Sport Model
                    <p>Feel the need for speed with a sports transmission</p>
                </label>
            </div>
            <div class="feature-card-box">
                <label class="feature-card" for="technology">
                    <input type="checkbox" name="technology" id="technology" value="technology">
                    Technology Package
                    <p>Add features like adaptive cruise control, and parking sensors</p>
                </label>
            </div>
        </div>
    </body>

</html>
