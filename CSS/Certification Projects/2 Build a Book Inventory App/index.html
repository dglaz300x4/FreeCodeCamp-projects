<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <title>Book Inventory</title>
    <link rel="stylesheet" href="styles.css">

  <body>
    <main>

          <th>Category</th>

        <tbody>
          <tr class="read">
            <th>Project Hail Mary</th>
            <td>Andy Weir</td>
            <td>Space, Sci-fi</td>
            <td><span class="status">Read</span></td>
            <td><span class="rate three">
              <span></span>
              <span></span>
              <span></span>
            </span></td>
          </tr>
          <tr class="read">
            <th>The Never Game</th>
            <td>Jeffery Deaver</td>
            <td>Mystery, Thriller</td>
            <td><span class="status">Read</span></td>
            <td><span class="rate three">
              <span></span>
              <span></span>
              <span></span>
            </span></td>
          </tr>
          <tr class="in-progress">
            <th>Green Lights</th>
            <td>Matthew McConaughey</td>
            <td>Memoir</td>
            <td><span class="status">In Progress</span></td>
            <td><span class="rate">
              <span></span>
              <span></span>
              <span></span>
            </span></td>
          </tr>
          <tr class="read">
            <th>The Midnight Line</th>
            <td>Lee Child</td>
            <td>Action</td>
            <td><span class="status">Read</span></td>
            <td><span class="rate two">
              <span></span>
              <span></span>
              <span></span>
            </span></td>
          </tr>
          <tr class="to-read">
            <th>Recursion</th>
            <td>Blake Crouch</td>
            <td>Sci-fi, Mystery</td>
            <td><span class="status">To Read</span></td>
            <td><span class="rate">
              <span></span>
              <span></span>
              <span></span>
            </span></td>
          </tr>

        </tbody>
      </table>
    </main>
  </body>

</html>
