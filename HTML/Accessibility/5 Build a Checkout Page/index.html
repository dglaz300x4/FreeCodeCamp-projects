<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://m.media-amazon.com/images/I/61o7oNwzKDL.jpg" width = 300 alt="Yellow robot Autobot Bumblebee Transformers toy">
        <p id="image-descript">Yellow robot Autobot Bumblebee Transformers toy</p>
    </section>

    <section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name">Cardholder Name <span aria-hidden="true">&ast;</span></label>
            <input id="card-name" name="card-name" type="text" required>
            <br>
            <label for="card-number" >Card Number <span aria-hidden="true">&ast;</span></label>
            <input id="card-number" name="card-number" type="text" required aria-describedby="card-number-help">
            <p id="card-number-help">Please enter your 16-digit card number without spaces or dashes</p>
            <label for="card-exp-date">Card Expiration Date <span aria-hidden="true">&ast;</span></label>
            <input id="card-exp-date" name="card-exp-date" type="text" required>
            <br>
            <label for="card-cvv">CVV <span aria-hidden="true">&ast;</span></label>
            <input id="card-cvv" name="card-cvv" type="text" required>
            <br>
            <button type="submit">Place Order</button>
        </form>
    </section>
</body>

</html>
